:root{
  --sun:#FFD23F;--sun-deep:#F2B705;--ink:#16233F;--board:#1D2F5C;--tile:#2B4281;--tile-edge:#3F5CAB;
  --card:#FFFFFF;--cream:#FFF8E6;--mute:#6B7896;--line:#C3CBDC;--go:#12A56F;--oops:#E5484D;
  --up:#2F7BF6;--right:#FF6B4A;--down:#12A56F;--left:#8E4EE0;
  --cp:#FF7EB6;--cc:#22C7D6;--cl:#A3E635;
  --display:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background-color:var(--sun);background-image:radial-gradient(var(--sun-deep) 1.5px,transparent 1.6px);background-size:22px 22px;
  color:var(--ink);font-family:var(--body);font-weight:700;font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--up);outline-offset:3px}
h1,h2,h3,p{margin:0}
#app{max-width:480px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font:800 22px/1 var(--display)}
.brand svg{width:40px;height:40px;flex:none}
.brand b{color:var(--right)}
.top-r{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;background:var(--card);border:3px solid var(--ink);border-radius:999px;font-weight:900;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:16px;height:16px}
.pill.low{background:var(--oops);color:#fff}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;background:var(--card);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:0}
.icon-btn svg{width:22px;height:22px}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.icon-btn.hint{background:var(--sun)}
.icon-btn.hint.glow{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 4px 0 var(--ink),0 0 0 0 rgba(242,183,5,.8)}50%{box-shadow:0 4px 0 var(--ink),0 0 0 8px rgba(242,183,5,0)}}
.eyebrow{display:block;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.star{display:inline-block;width:1em;height:1em;background:var(--line);clip-path:polygon(50% 2%,62% 36%,98% 36%,69% 58%,80% 94%,50% 72%,20% 94%,31% 58%,2% 36%,38% 36%)}
.star.on{background:var(--sun-deep)}
.card{background:var(--card);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink)}

/* home */
.hello{padding:18px;display:flex;gap:14px;align-items:center}
.hello .bot{width:72px;height:72px;flex:none;animation:bob 2.4s ease-in-out infinite}
.hello h1{font:800 26px/1.08 var(--display)}
.hello p{color:var(--mute);font-size:14px;margin-top:4px}
.tot{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.tot span{display:inline-flex;align-items:center;gap:5px;font-weight:900;font-size:14px;background:var(--cream);border:2px solid var(--ink);border-radius:999px;padding:3px 10px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.worlds{display:flex;flex-direction:column;gap:12px}
.world{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px 14px;text-align:left;width:100%}
.world:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.wico{width:62px;height:62px;border:3px solid var(--ink);border-radius:18px;display:grid;place-items:center;color:#fff;font:800 30px/1 var(--display);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.wico svg{width:34px;height:34px}
.world h3{font:800 21px/1.05 var(--display)}
.world p{font-size:13px;color:var(--mute);margin-top:2px}
.world>span:nth-child(2){display:block;min-width:0}
.bar{display:block;height:10px;border:2px solid var(--ink);border-radius:99px;background:var(--cream);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--go)}
.wmeta{text-align:right;font-weight:900;font-size:13px;white-space:nowrap}
.wmeta .star{font-size:15px;vertical-align:-2px}
.world.locked{background:#EEF1F7;border-color:#9AA6C0;box-shadow:0 6px 0 #9AA6C0;color:#7D88A3}
.world.locked .wico{filter:grayscale(1);opacity:.55;border-color:#9AA6C0}
.world.locked:active{transform:none;box-shadow:0 6px 0 #9AA6C0}

/* world screen */

.lv{aspect-ratio:1/1.12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;background:var(--sun);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink)}

/* play */
.lvl-title{flex:1;min-width:0;line-height:1.1}

.board-wrap{display:flex;justify-content:center}
.board{position:relative;display:grid;grid-template-columns:repeat(var(--cols),var(--cell));grid-auto-rows:var(--cell);gap:6px;padding:10px;background:var(--board);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink)}
.cell{border-radius:12px;background:var(--tile);box-shadow:inset 0 2px 0 var(--tile-edge);display:grid;place-items:center;position:relative}
.cell>svg{width:74%;height:74%}
.cell.rock{background:#14213F;box-shadow:none}
.cell.rock svg{width:86%;height:86%}
.cell.water{background:#2AA4E8;box-shadow:inset 0 2px 0 #7CCBF5;overflow:hidden}
.cell.water svg{width:100%;height:100%}
.cell.home{outline:2px dashed rgba(255,255,255,.45);outline-offset:-6px}
.cell.cp{background:var(--cp);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.cell.cc{background:var(--cc);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.cell.cl{background:var(--cl);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.cell.cp svg,.cell.cc svg,.cell.cl svg{width:46%;height:46%}
.cell .goal{animation:pulse 1.6s ease-in-out infinite}
.gone{opacity:0;transform:scale(.3);transition:all .25s}
.coin{width:76%;height:76%;border-radius:50%;background:var(--sun);border:3px solid var(--ink);display:grid;place-items:center;font:800 calc(var(--cell)*.42)/1 var(--display);color:var(--ink);box-shadow:inset 0 -3px 0 var(--sun-deep)}
.coin.neg{background:#FFD5D6;color:var(--oops);box-shadow:inset 0 -3px 0 #F6A9AB}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.robot{position:absolute;left:10px;top:10px;width:var(--cell);height:var(--cell);display:grid;place-items:center;pointer-events:none;z-index:2;
  transform:translate(calc(var(--c)*(var(--cell) + 6px)),calc(var(--r)*(var(--cell) + 6px)));transition:transform .34s cubic-bezier(.3,1.25,.5,1)}
.robot.snap{transition:none}
.robot svg.bot{width:86%;height:86%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.face{position:absolute;inset:0;display:grid;place-items:center;transition:transform .2s}
.face i{position:absolute;top:-9px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:12px solid #fff;filter:drop-shadow(0 0 1px var(--ink)) drop-shadow(0 0 1px var(--ink))}
.tape-wrap{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:8px 10px 10px}

.tape-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.tape-head .eyebrow{letter-spacing:.06em}
.tape-head .cnt{font-size:13px;font-weight:900;color:var(--mute);font-variant-numeric:tabular-nums}
.tape{display:flex;flex-wrap:wrap;gap:6px}
.slot{width:36px;height:36px;padding:0;border-radius:10px;border:2px dashed var(--line);background:transparent;display:grid;place-items:center;font-size:12px;font-weight:900;color:#A7B1C8;position:relative}
.slot.f{border:2px solid var(--ink);color:#fff}
.slot.f svg{width:20px;height:20px}
.slot.U{background:var(--up)}.slot.R{background:var(--right)}.slot.D{background:var(--down)}.slot.L{background:var(--left)}
.slot.fix{opacity:.9;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.slot.blank{border:2px dashed var(--ink);color:var(--ink);background:var(--cream);font:800 18px var(--display)}
.slot.loop{background:var(--sun);color:var(--ink);width:auto;min-width:62px;padding:0 7px;font:800 15px var(--display);display:inline-flex;align-items:center;justify-content:center;gap:2px}

.slot.mark{box-shadow:0 0 0 3px var(--oops)}
.slot.chg:after{content:"";position:absolute;top:-5px;right:-5px;width:10px;height:10px;border-radius:50%;background:var(--sun);border:2px solid var(--ink)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.loopbox{border-color:var(--sun-deep);background:#FFFBEA}
.cnt-ctl{display:flex;align-items:center;gap:6px}

.minor{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ghost{height:46px;padding:0 6px;border:3px solid var(--ink);border-radius:14px;background:var(--card);font-weight:900;font-size:14px;box-shadow:0 4px 0 var(--ink)}

.is-busy .key,.is-busy .ghost,.is-busy .slot,.is-busy .rulebtn,.is-busy .cnt-ctl button,.is-busy .icon-btn.hint{pointer-events:none;opacity:.55}

.rules{display:flex;flex-direction:column;gap:8px}
.rule{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:8px 10px}
.sw{width:46px;height:46px;border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center}
.sw svg{width:22px;height:22px}
.sw.cp{background:var(--cp)}.sw.cc{background:var(--cc)}.sw.cl{background:var(--cl)}
.rule .txt{font-size:13px;line-height:1.2}
.rule .txt b{font:800 16px/1.1 var(--display);display:block}
.rulebtn{width:58px;height:52px;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;color:#fff;background:#C9D1E0;padding:0;font:800 24px var(--display)}
.rulebtn svg{width:28px;height:28px}
.rulebtn.U{background:var(--up)}.rulebtn.R{background:var(--right)}.rulebtn.D{background:var(--down)}.rulebtn.L{background:var(--left)}
.rulebtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.rule.mark{box-shadow:0 0 0 4px var(--sun-deep)}
.solo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.solo .run{grid-column:1/-1}

#app.compact{gap:10px;padding-top:10px;padding-bottom:16px}
.compact .mission{min-height:44px;font-size:15px;padding:6px 12px}
.compact .tape-wrap{padding:6px 8px 8px}
.compact .tape-head{margin-bottom:4px}
.compact .slot{width:32px;height:32px}
.compact .board{padding:8px;border-radius:18px}
.compact .robot{left:8px;top:8px}
.compact .dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:5px}
.compact .run{height:62px;font-size:22px}
.compact .ghost{height:42px}
.compact .sw{width:40px;height:40px}.compact .rulebtn{height:44px}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(22,35,63,.62);display:grid;place-items:center;padding:20px;z-index:10;overflow:auto}
.sheet{width:100%;max-width:390px;background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;text-align:center;animation:pop .28s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:scale(1);opacity:1}}

.cert .wi2{width:38px;height:38px;margin:0 auto 5px;border-radius:11px;border:2.5px solid var(--ink);color:#fff;display:grid;place-items:center;font:900 18px var(--body)}
.cert .wi2 svg{width:22px;height:22px}
.cert .w b{display:block;font:800 13px/1.1 var(--display)}
.cert .w s{text-decoration:none;font-size:10px;color:#5B6478}

.cert .md big{display:block;font-size:24px;color:var(--sun)}

function parse(lv){
  var P={rows:lv.g.length,cols:lv.g[0].length,cells:[],bats:[],nums:[],start:null,star:null};
  for(var r=0;r<P.rows;r++){P.cells.push([]);for(var c=0;c<P.cols;c++){
    var ch=lv.g[r][c],t=".";
    if(ch==="#"||ch==="~")t=ch;
    else if(ch==="R")P.start=[r,c];
    else if(ch==="S")P.star=[r,c];
    else if(ch==="B")P.bats.push([r,c]);
    else if(NUMV[ch]!==undefined)P.nums.push([r,c,NUMV[ch]]);
    else if(ch==="p"||ch==="c"||ch==="l")t="c"+ch;
    P.cells[r].push(t);
  }}
  return P;
}

function starsOf(w,i){return S.stars[sk(w,i)]||0;}

function starsIn(w){var n=0;for(var i=0;i<LV[w].length;i++)n+=starsOf(w,i);return n;}
function worldOpen(w){return w===1||S.set.unlock||clearedIn(w-1)>=UNLOCK_NEXT;}
function levelOpen(w,i){return worldOpen(w)&&(i===0||S.set.unlock||starsOf(w,i-1)>0);}
function totalLevels(){var n=0;WORLDS.forEach(function(w){n+=LV[w.id].length;});return n;}
function totalCleared(){var n=0;WORLDS.forEach(function(w){n+=clearedIn(w.id);});return n;}
function totalStars(){var n=0;WORLDS.forEach(function(w){n+=starsIn(w.id);});return n;}
function allDone(){return totalCleared()===totalLevels();}

/* ---------- sound ---------- */
var AC=null;
function tone(f,d,type,vol,when){
  if(!S.set.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(when||0);
    o.type=type||"triangle";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.08,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}
}
var sfx={tap:function(){tone(660,.07);},del:function(){tone(330,.07);},step:function(){tone(520,.09);},
  get:function(){tone(784,.09);tone(1175,.13,"triangle",.08,.08);},turn:function(){tone(880,.06,"square",.04);},
  bump:function(){tone(140,.24,"sawtooth",.06);},
  win:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.17,"triangle",.09,i*.11);});},
  big:function(){[523,659,784,1047,784,1047,1319].forEach(function(f,i){tone(f,.18,"triangle",.09,i*.12);});}};

function timeLeft(){return S.set.limit>0?Math.max(0,S.set.limit*60+S.extra-S.used):-1;}
function fmt(s){var m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

/* ---------- play: setup ---------- */
function curLv(){return LV[S.world][S.idx];}
function initGame(){
  var lv=curLv(),w=lv.w;
  G={lv:lv,P:parse(lv),mode:({1:"seq",2:"pat",3:"loop",4:"debug",5:"rule",6:"math"})[w]};
  if(G.mode==="seq"||G.mode==="math")G.prog=[];
  if(G.mode==="pat")G.prog=lv.tpl.split("").map(function(c){return c==="_"?null:c;});
  if(G.mode==="loop"){G.main=[];G.body=[];G.n=2;G.active="main";}
  if(G.mode==="debug")G.prog=lv.bug.split("");
  if(G.mode==="rule"){G.rules={};lv.cols.split("").forEach(function(c){G.rules[c]="?";});}
  G.mark=-1;
  T.fails=0;T.hints=0;T.err=-1;T.msg="";T.good=false;T.running=false;
}
function cellSize(P){var w=Math.min(app.clientWidth||360,480)-32-26;return Math.max(30,Math.floor(Math.min((w-6*(P.cols-1))/P.cols,66)));}
function overflow(){var ctr=$(".controls");if(!ctr)return 0;var pb=parseFloat(getComputedStyle(app).paddingBottom)||0;
  return ctr.getBoundingClientRect().bottom+(window.pageYOffset||0)+pb+2-(window.innerHeight||700);}
function fitBoard(P,cell){var board=$("#board");if(!board)return;var over=overflow();
  if(over>0){app.classList.add("compact");over=overflow();}
  if(over>0)board.style.setProperty("--cell",Math.max(28,Math.floor(cell-over/P.rows))+"px");}

function boardHtml(P,cell){
  var cells="";
  for(var r=0;r<P.rows;r++)for(var c=0;c<P.cols;c++){
    var t=P.cells[r][c],cls="cell",inner="";
    if(t==="#"){cls+=" rock";inner=rockSvg();}
    else if(t==="~"){cls+=" water";inner=waterSvg();}
    else if(t.charAt(0)==="c"){cls+=" "+t;inner=shapeSvg(t.charAt(1));}
    if(t!=="#"&&t!=="~"){
      if(r===P.start[0]&&c===P.start[1])cls+=" home";
      if(r===P.star[0]&&c===P.star[1])inner=starSvg();
      P.bats.forEach(function(b,i){if(b[0]===r&&b[1]===c)inner=batSvg(i);});
      P.nums.forEach(function(n,i){if(n[0]===r&&n[1]===c)inner='<span class="coin'+(n[2]<0?" neg":"")+'" data-num="'+i+'">'+(n[2]<0?"−"+(-n[2]):n[2])+'</span>';});
    }
    cells+='<div class="'+cls+'">'+inner+'</div>';
  }
  var face=G.mode==="rule"?'<div class="face" id="face" style="transform:rotate('+ROT[G.lv.d0]+'deg)"><i></i></div>':"";
  return '<div class="board-wrap"><div class="board" id="board" style="--cols:'+P.cols+';--rows:'+P.rows+';--cell:'+cell+'px">'+cells+
   '<div class="robot snap" id="robot" style="--r:'+P.start[0]+';--c:'+P.start[1]+'"><div id="robotIn" style="display:grid;place-items:center;width:100%;height:100%;position:relative">'+face+robot()+'</div></div></div></div>';
}

  return '<div class="dpad">'+keys+(withLoop?'<button class="key LOOP" data-act="addloop" aria-label="Masukkan blok Ulangi">'+ICON.loop+'</button>':'<div class="dpad-mid">'+robot()+'</div>')+'</div>';
}

    body='<div class="tape-wrap" id="tMain" data-act="selmain"><div class="tape-head"><span class="eyebrow">Program utama</span><span class="cnt" id="cntMain"></span></div><div class="tape" id="tapeMain"></div></div>'+
     '<div class="tape-wrap loopbox" id="tBody" data-act="selbody"><div class="tape-head"><span class="eyebrow">'+ICON.loop.replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px"')+' Isi blok Ulangi</span>'+

function slotHtml(d,i,attr,extra){
  return '<button class="slot f '+d+(extra||"")+'" '+attr+' aria-label="Perintah '+(i+1)+': '+DNAME[d]+'">'+arrow(d)+'</button>';
}
function drawProg(now,nowBody){
  var lv=G.lv,h="";
  if(G.mode==="seq"||G.mode==="math"){
    for(var i=0;i<lv.max;i++){var d=G.prog[i];
      h+=d?slotHtml(d,i,'data-slot="'+i+'"',(i===now?" now":"")+(i===T.err?" err":"")):'<span class="slot">'+(i+1)+'</span>';}
    $("#tape").innerHTML=h;$("#tapeCount").textContent=G.prog.length+"/"+lv.max;
  }else if(G.mode==="pat"){
    var fill=0,tot=0;
    G.prog.forEach(function(d,i){var fix=lv.tpl[i]!=="_";if(!fix){tot++;if(d)fill++;}
      if(d)h+=slotHtml(d,i,fix?'data-fix="1" tabindex="-1"':'data-slot="'+i+'"',(fix?" fix":"")+(i===now?" now":"")+(i===T.err?" err":"")+(i===G.mark?" mark":""));
      else h+='<button class="slot blank'+(i===G.mark?" mark":"")+'" data-slot="'+i+'" aria-label="Kotak kosong">?</button>';});
    $("#tape").innerHTML=h;$("#tapeCount").textContent=fill+"/"+tot+" terisi";
  }else if(G.mode==="loop"){
    for(var a=0;a<lv.mainMax;a++){var m=G.main[a];
      if(m==="*")h+='<button class="slot f loop'+(a===now?" now":"")+(a===T.err?" err":"")+'" data-mslot="'+a+'" aria-label="Blok Ulangi">'+ICON.loop+'×'+G.n+'</button>';
      else if(m)h+=slotHtml(m,a,'data-mslot="'+a+'"',(a===now?" now":"")+(a===T.err?" err":""));

  }else if(G.mode==="debug"){

    $("#tape").innerHTML=h;
  }else if(G.mode==="rule"){

      h+='<div class="rule'+(G.mark===c?" mark":"")+'"><span class="sw c'+c+'">'+shapeSvg(c)+'</span><span class="txt"><b>KALAU injak '+CNAME[c]+'</b>MAKA Robi menghadap</span>'+
       '<button class="rulebtn '+(d==="?"?"":d)+'" data-rule="'+c+'" aria-label="Arah untuk warna '+CNAME[c]+': '+(d==="?"?"tidak belok":DNAME[d])+'">'+(d==="?"?"–":arrow(d))+'</button></div>';});
    $("#rules").innerHTML=h;

function canRun(){

}

function resetBoard(){var P=G.P;placeRobot(P.start[0],P.start[1],true);app.querySelectorAll(".gone").forEach(function(b){b.classList.remove("gone");});if(G.mode==="rule")setFace(G.lv.d0);if(G.mode==="math")setSum(0);}

/* ---------- editing ---------- */
function addCmd(d){
  if(T.running||T.overlay)return;var lv=G.lv;
  if(G.mode==="seq"||G.mode==="math"){if(G.prog.length>=lv.max)return;G.prog.push(d);}
  else if(G.mode==="pat"){var i=G.prog.indexOf(null);if(i<0)return;G.prog[i]=d;}
  else if(G.mode==="loop"){
    if(G.active==="main"){if(G.main.length>=lv.mainMax)return;G.main.push(d);}
    else{if(G.body.length>=lv.bodyMax)return;G.body.push(d);}
  }else return;
  G.mark=-1;clearErr();sfx.tap();drawProg();
}
function undo(){
  if(T.running)return;
  if(G.mode==="seq"||G.mode==="math")G.prog.pop();
  else if(G.mode==="pat"){for(var i=G.prog.length-1;i>=0;i--)if(G.lv.tpl[i]==="_"&&G.prog[i]){G.prog[i]=null;break;}}
  else if(G.mode==="loop"){if(G.active==="main")G.main.pop();else G.body.pop();}
  clearErr();sfx.del();drawProg();
}
function clearAll(){
  if(T.running)return;var lv=G.lv;
  if(G.mode==="seq"||G.mode==="math")G.prog=[];
  else if(G.mode==="pat")G.prog=lv.tpl.split("").map(function(c){return c==="_"?null:c;});
  else if(G.mode==="loop"){G.main=[];G.body=[];G.n=2;}
  else if(G.mode==="debug")G.prog=lv.bug.split("");
  else if(G.mode==="rule")for(var c in G.rules)G.rules[c]="?";
  G.mark=-1;clearErr();sfx.del();drawProg();resetBoard();
}
var CYC=["U","R","D","L"];
function tapSlot(i){
  if(T.running)return;
  if(G.mode==="seq"||G.mode==="math")G.prog.splice(i,1);
  else if(G.mode==="pat"){if(G.lv.tpl[i]!=="_")return;G.prog[i]=null;}
  else if(G.mode==="debug"){G.prog[i]=CYC[(CYC.indexOf(G.prog[i])+1)%4];sfx.turn();clearErr();drawProg();return;}
  clearErr();sfx.del();drawProg();
}
function tapRule(c){if(T.running)return;var o=["?","U","R","D","L"];G.rules[c]=o[(o.indexOf(G.rules[c])+1)%5];sfx.turn();clearErr();drawProg();}

/* ---------- run ---------- */
function expand(){
  if(G.mode==="loop"){var out=[],map=[];
    G.main.forEach(function(m,i){if(m==="*"){for(var k=0;k<G.n;k++)G.body.forEach(function(b,j){out.push(b);map.push([i,j]);});}else{out.push(m);map.push([i,-1]);}});
    return {cmds:out,map:map};}
  return {cmds:G.prog.slice(),map:null};
}
function run(){
  if(T.running||T.overlay||!canRun())return;
  if(G.mode==="pat"&&G.prog.indexOf(null)>=0){T.msg="Isi dulu semua kotak bertanda ? ya.";T.good=false;setMsg();sfx.bump();return;}
  if(G.mode==="loop"&&G.main.indexOf("*")>=0&&!G.body.length){T.msg="Blok Ulangi masih kosong. Isi dulu perintah di dalamnya.";T.good=false;setMsg();sfx.bump();return;}
  if(G.mode==="rule")return runRule();
  var tk=++T.token,P=G.P,lv=G.lv;
  T.running=true;T.err=-1;T.msg="";T.good=false;setMsg();app.classList.add("is-busy");drawProg();resetBoard();
  var X=expand(),prog=X.cmds,r=P.start[0],c=P.start[1],got={},nb=0,taken={},sum=0;
  var STEP=prog.length>18?300:400;
  (async function(){
    await sleep(240);
    for(var i=0;i<prog.length;i++){
      if(tk!==T.token)return;
      if(X.map){drawProg(X.map[i][0],X.map[i][1]);}else drawProg(i);
      if(G.mode==="math")setSum(sum);
      var d=DIRS[prog[i]],nr=r+d[0],nc=c+d[1];
      var t=(nr<0||nc<0||nr>=P.rows||nc>=P.cols)?"edge":P.cells[nr][nc];
      if(t==="#"||t==="~"||t==="edge"){
        var inn=$("#robotIn");if(inn&&inn.animate)inn.animate([{transform:"translate(0,0)"},{transform:"translate("+(d[1]*12)+"px,"+(d[0]*12)+"px)"},{transform:"translate(0,0)"}],{duration:320});
        sfx.bump();await sleep(560);if(tk!==T.token)return;
        return fail(X.map?X.map[i][0]:i,t);
      }
      r=nr;c=nc;placeRobot(r,c);sfx.step();await sleep(STEP);if(tk!==T.token)return;
      P.bats.forEach(function(b,k){if(b[0]===r&&b[1]===c&&!got[k]){got[k]=1;nb++;var el=app.querySelector('[data-bat="'+k+'"]');if(el)el.classList.add("gone");sfx.get();}});
      P.nums.forEach(function(n,k){if(n[0]===r&&n[1]===c&&!taken[k]){taken[k]=1;sum+=n[2];var el=app.querySelector('[data-num="'+k+'"]');if(el)el.classList.add("gone");sfx.get();setSum(sum);}});
      if(r===P.star[0]&&c===P.star[1]){
        if(G.mode==="math"){if(sum===lv.t)return win(prog);return fail(X.map?X.map[i][0]:i,"sum",sum);}
        if(nb===P.bats.length)return win(prog);
      }
    }
    if(tk!==T.token)return;
    fail(-1,(r===P.star[0]&&c===P.star[1])?"bat":"short",sum);
  })();
}
function runRule(){
  var tk=++T.token,P=G.P,lv=G.lv;
  T.running=true;T.err=-1;T.msg="";T.good=false;setMsg();app.classList.add("is-busy");drawProg();resetBoard();
  var r=P.start[0],c=P.start[1],d=lv.d0;
  (async function(){
    await sleep(240);
    for(var t=0;t<60;t++){
      if(tk!==T.token)return;
      var v=DIRS[d],nr=r+v[0],nc=c+v[1];
      var ty=(nr<0||nc<0||nr>=P.rows||nc>=P.cols)?"edge":P.cells[nr][nc];
      if(ty==="#"||ty==="~"||ty==="edge"){
        var inn=$("#robotIn");if(inn&&inn.animate)inn.animate([{transform:"translate(0,0)"},{transform:"translate("+(v[1]*12)+"px,"+(v[0]*12)+"px)"},{transform:"translate(0,0)"}],{duration:320});
        sfx.bump();await sleep(560);if(tk!==T.token)return;return fail(-1,ty);
      }
      r=nr;c=nc;placeRobot(r,c);sfx.step();await sleep(340);if(tk!==T.token)return;
      if(r===P.star[0]&&c===P.star[1])return win(null);
      if(ty.charAt(0)==="c"){var nd=G.rules[ty.charAt(1)];if(nd&&nd!=="?"&&nd!==d){d=nd;setFace(d);sfx.turn();await sleep(160);}}
    }
    fail(-1,"loop");
  })();
}
function fail(i,why,sum){
  var at=i>=0?" di langkah "+(i+1):"";
  T.msg=why==="#"?"Ups, Robi menabrak batu"+at+". Ganti perintahnya.":
        why==="~"?"Byur! Robi masuk air"+at+". Ganti perintahnya.":
        why==="edge"?"Robi keluar papan"+at+". Ganti perintahnya.":
        why==="bat"?"Sudah di bintang, tapi baterai belum terambil semua.":
        why==="sum"?"Jumlahnya "+sum+", padahal targetnya "+G.lv.t+". Coba ambil angka lain.":
        why==="loop"?"Robi berputar-putar terus. Coba ubah aturannya.":
        G.mode==="math"?"Perintah habis sebelum sampai bintang. Tambah perintah lagi.":
        "Perintah habis, bintang belum tercapai.";
  if(G.mode==="rule"&&(why==="#"||why==="~"||why==="edge"))T.msg=(why==="~"?"Byur! Robi masuk air.":why==="edge"?"Robi keluar papan.":"Robi menabrak batu.")+" Aturan mana yang perlu diganti?";
  T.err=i;T.good=false;T.running=false;T.fails++;app.classList.remove("is-busy");
  setMsg();drawProg();
  if(T.fails===2){var hb=$("[data-act=hint]");if(hb){hb.style.display="";hb.classList.add("glow");}}
  var tk=T.token;setTimeout(function(){if(tk===T.token&&S.view==="play"&&!T.running)resetBoard();},900);
}
function scoreStars(prog){
  var lv=G.lv,st;
  if(G.mode==="seq"||G.mode==="math"){var u=prog.length;st=u<=lv.opt?3:(u<=lv.opt+2?2:1);}
  else if(G.mode==="loop"){var b=G.main.length+G.body.length;st=b<=lv.opt?3:(b<=lv.opt+2?2:1);}
  else st=T.fails===0?3:(T.fails<=2?2:1);
  if(T.hints>0)st=Math.min(st,2);
  return st;
}
function win(prog){
  var lv=G.lv,st=scoreStars(prog),key=sk(S.world,S.idx),first=!starsOf(S.world,S.idx);
  var before=allDone();
  if(st>(S.stars[key]||0))S.stars[key]=st;
  T.running=false;app.classList.remove("is-busy");save();sfx.win();confetti();
  var last=S.idx===LV[S.world].length-1;
  var info="";
  if(G.mode==="seq"||G.mode==="math")info="Kamu pakai "+prog.length+" perintah. Paling hemat "+lv.opt+"."+(st<3?" Coba lagi untuk 3 bintang.":"");
  else if(G.mode==="loop")info="Kamu pakai "+(G.main.length+G.body.length)+" blok perintah. Paling hemat "+lv.opt+"."+(st<3?" Bisa lebih hemat?":"");
  else info=T.fails===0?"Langsung benar di percobaan pertama!":"Berhasil setelah "+(T.fails+1)+" kali mencoba. Mencoba lagi itu bagian dari belajar.";
  if(T.hints>0)info+=" (Pakai petunjuk.)";
  var unlockMsg="";
  if(first&&S.world<WORLDS.length&&clearedIn(S.world)===UNLOCK_NEXT&&!S.set.unlock)unlockMsg='<p style="color:var(--go);font-weight:900">Dunia '+(S.world+1)+': '+WORLDS[S.world].name+' sekarang terbuka!</p>';
  var certNow=EDITION==="lengkap"&&!before&&allDone();
  openOverlay(
    '<div class="bigstars" aria-label="'+st+' dari 3 bintang">'+[1,2,3].map(function(k){return '<i class="star'+(k<=st?" on":"")+'"></i>';}).join("")+'</div>'+
    '<h2>'+(st===3?"Hebat, sempurna!":"Berhasil!")+'</h2><p>'+info+'</p>'+unlockMsg+
    (certNow?'<button class="btn sun" data-act="cert">Buka sertifikat!</button>':"")+
    (last?'<button class="btn" data-act="world">Lihat semua level</button>':'<button class="btn" data-act="next">Level berikutnya</button>')+
    '<button class="btn alt" data-act="retry">Coba lagi</button>');
  if(certNow)sfx.big();
}
function confetti(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var d=document.createElement("div");d.className="confetti";var cs=["#FFD23F","#FF6B4A","#2F7BF6","#12A56F","#8E4EE0","#FF7EB6"];
  for(var i=0;i<40;i++){var x=document.createElement("i");x.style.left=Math.random()*100+"%";x.style.background=cs[i%cs.length];x.style.animationDelay=(Math.random()*.5)+"s";x.style.animationDuration=(1.2+Math.random()*.9)+"s";d.appendChild(x);}
  document.body.appendChild(d);setTimeout(function(){d.remove();},2600);
}

/* ---------- hints ---------- */
function hint(){
  if(T.running)return;var lv=G.lv;T.hints++;
  if(G.mode==="seq"||G.mode==="math"){
    var k=Math.min(lv.sol.length,Math.max(2,Math.ceil(lv.sol.length/3))*T.hints);
    G.prog=lv.sol.slice(0,k).split("");T.msg="Petunjuk: "+k+" perintah pertama sudah diisi. Lanjutkan sisanya!";
  }else if(G.mode==="pat"){
    for(var i=0;i<G.prog.length;i++)if(lv.tpl[i]==="_"&&G.prog[i]!==lv.sol[i]){G.prog[i]=lv.sol[i];break;}
    T.msg="Petunjuk: satu kotak sudah diisi dengan benar.";
  }else if(G.mode==="loop"){
    if(T.hints===1){G.body=lv.sol.body.split("");G.n=lv.sol.n;T.msg="Petunjuk: isi blok Ulangi dan jumlahnya sudah diatur. Sekarang susun program utamanya.";}
    else{G.main=lv.sol.main.split("");T.msg="Petunjuk: program utama sudah diisi. Tekan Jalankan!";}
  }else if(G.mode==="debug"){
    for(var j=0;j<G.prog.length;j++)if(G.prog[j]!==lv.sol[j]){G.mark=j;break;}
    T.msg="Petunjuk: perintah yang bergaris merah perlu diganti.";
  }else if(G.mode==="rule"){
    for(var c in lv.sol)if(G.rules[c]!==lv.sol[c]){G.rules[c]=lv.sol[c];G.mark=c;break;}
    T.msg="Petunjuk: satu aturan sudah diatur dengan benar.";
  }
  T.good=true;T.err=-1;sfx.get();resetBoard();drawProg();setMsg();
}

function openOverlay(html){
  closeOverlay();var o=document.createElement("div");o.className="overlay";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");

}

function bindHold(btn){
  var ms=2000,t=null;
  function start(e){if(e)e.preventDefault();if(t)return;btn.style.setProperty("--ms",ms+"ms");btn.classList.add("holding");
    t=setTimeout(function(){t=null;btn.classList.remove("holding");holdDone(btn.getAttribute("data-hold"));},ms);}
  function stop(){btn.classList.remove("holding");clearTimeout(t);t=null;}
  btn.addEventListener("pointerdown",start);["pointerup","pointerleave","pointercancel"].forEach(function(ev){btn.addEventListener(ev,stop);});
  btn.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" ")start(e);});btn.addEventListener("keyup",stop);
  btn.addEventListener("contextmenu",function(e){e.preventDefault();});
}

  else if(what==="settings")showSettings();

  var t=timeLeft();
  openOverlay('<h2>Pengaturan</h2>'+
    '<div class="set"><span class="eyebrow">Batas main per hari</span>'+opts("limit",[[10,"10 mnt"],[15,"15 mnt"],[20,"20 mnt"],[0,"Bebas"]],S.set.limit)+
    '<span style="font-size:12px;color:var(--mute)">Hari ini sudah main '+Math.floor(S.used/60)+' menit.'+(t>=0?" Sisa "+fmt(t)+".":"")+'</span></div>'+
    '<div class="set"><span class="eyebrow">Suara</span>'+opts("sound",[[true,"Nyala"],[false,"Mati"]],S.set.sound)+'</div>'+
    '<div class="set"><span class="eyebrow">Level &amp; dunia</span>'+opts("unlock",[[false,"Buka bertahap"],[true,"Buka semua"]],S.set.unlock)+'</div>'+
    '<div class="set"><span class="eyebrow">Progres</span><span style="font-size:13px">'+totalCleared()+' dari '+totalLevels()+' level selesai, '+totalStars()+' bintang.</span></div>'+
    '<button class="hold" data-hold="wipe"><span>Tahan 2 detik untuk hapus semua progres</span></button>'+
    '<button class="btn" data-act="close-render">Selesai</button>');
}

/* ---------- routing & events ---------- */
function render(){closeOverlay();app.classList.remove("compact");
  if(S.view==="play")renderPlay();else if(S.view==="world")renderWorld();else if(S.view==="cert")renderCert();else renderHome();
  window.scrollTo(0,0);}
function openLevel(i){
  if(!levelOpen(S.world,i))return;
  T.token++;S.idx=i;S.view="play";initGame();render();
  if(timeLeft()===0)showTimeUp();
}
app.addEventListener("click",function(e){
  var el=e.target.closest("[data-act],[data-d],[data-lv],[data-slot],[data-mslot],[data-bslot],[data-set],[data-world],[data-rule]");
  if(!el||el.disabled)return;
  if(el.hasAttribute("data-d"))return addCmd(el.getAttribute("data-d"));
  if(el.hasAttribute("data-slot"))return tapSlot(+el.getAttribute("data-slot"));
  if(el.hasAttribute("data-mslot")){if(T.running)return;G.active="main";G.main.splice(+el.getAttribute("data-mslot"),1);clearErr();sfx.del();return drawProg();}
  if(el.hasAttribute("data-bslot")){if(T.running)return;G.active="body";G.body.splice(+el.getAttribute("data-bslot"),1);clearErr();sfx.del();return drawProg();}
  if(el.hasAttribute("data-rule"))return tapRule(el.getAttribute("data-rule"));
  if(el.hasAttribute("data-world")){var w=+el.getAttribute("data-world");if(!worldOpen(w)){sfx.bump();return;}sfx.tap();S.world=w;S.view="world";return render();}
  if(el.hasAttribute("data-lv")){sfx.tap();return openLevel(+el.getAttribute("data-lv"));}
  if(el.hasAttribute("data-set")){var k=el.getAttribute("data-set"),v=el.getAttribute("data-val");S.set[k]=k==="limit"?+v:(v==="true");save();return showSettings();}
  var a=el.getAttribute("data-act");
  if(a==="run")run();
  else if(a==="undo")undo();
  else if(a==="clear")clearAll();
  else if(a==="hint")hint();
  else if(a==="addloop"){if(T.running||G.main.length>=G.lv.mainMax)return;G.main.push("*");G.active="body";clearErr();sfx.tap();drawProg();}
  else if(a==="selmain"){if(!T.running&&G.active!=="main"){G.active="main";drawProg();}}
  else if(a==="selbody"){if(!T.running&&G.active!=="body"){G.active="body";drawProg();}}
  else if(a==="nminus"){if(!T.running&&G.n>2){G.n--;sfx.tap();clearErr();drawProg();}}
  else if(a==="nplus"){if(!T.running&&G.n<9){G.n++;sfx.tap();clearErr();drawProg();}}
  else if(a==="home"){T.token++;T.running=false;S.view="home";render();}
  else if(a==="world"){T.token++;T.running=false;S.view="world";render();}
  else if(a==="how")showHow();
  else if(a==="cert"){if(EDITION==="lengkap"&&allDone()){S.view="cert";render();}else{sfx.bump();}}
  else if(a==="print")printCert();
  else if(a==="sound"){S.set.sound=!S.set.sound;save();sfx.tap();renderPlay();}
  else if(a==="next"){closeOverlay();if(S.idx+1<LV[S.world].length)openLevel(S.idx+1);}
  else if(a==="retry"){closeOverlay();T.token++;initGame();renderPlay();}
  else if(a==="parent")showParentGate();
  else if(a==="close")closeOverlay();
  else if(a==="close-render")render();
});
document.addEventListener("keydown",function(e){
  if(S.view!=="play"||T.overlay||e.target.tagName==="INPUT")return;
  var map={ArrowUp:"U",ArrowRight:"R",ArrowDown:"D",ArrowLeft:"L"};
  if(map[e.key]&&G.mode!=="debug"&&G.mode!=="rule"){e.preventDefault();addCmd(map[e.key]);}
  else if(e.key==="Backspace"){e.preventDefault();undo();}
  else if(e.key==="Enter"&&!e.target.closest("button")){e.preventDefault();run();}
});
var rz=null;
window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){
  if(S.view==="play"&&!T.running&&!T.overlay){app.classList.remove("compact");renderPlay();}
  if(S.view==="cert"){var inp=$("#cname");if(inp)inp.dispatchEvent(new Event("input"));}},150);});
setInterval(function(){
  if(S.day!==dayNow()){S.day=dayNow();S.used=0;S.extra=0;}
  if(S.view!=="play"||document.hidden||S.set.limit<=0)return;
  if(T.overlay&&timeLeft()===0)return;
  S.used++;if(S.used%5===0)save();updateTime();
  if(timeLeft()===0){save();showTimeUp();}
},1000);

load();render();
})();
</script>
</body>
</html>
